# render.yaml — Render Blueprint for McLarens MTEA Backend
services:
  - type: web
    name: mtea-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://your-app.vercel.app
      - key: MAX_FILE_SIZE_MB
        value: "10"
    healthCheckPath: /health
    plan: free
    region: singapore
